<body>
    <header>
        <div id="title-bar">
            <h1>Art</h1>
            <p id="menu-icon" role="button" tabindex="0">≡</p>
        </div>
    
        <nav id="nav" class="hidden">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="art.html" class="current-link">Art</a></li>

    <main>
        <nav aria-label="Art Sections" class = "sub-nav">
            <ul>
                <li><a href="#chroma-art">- Jump to Chroma Corps art -</a></li>
            </ul>

        </nav>
        <div class="images" id="main-art">
            <img class="landscape" src="images/splash art sans gaster blaster.jpg" 
            alt="A colour painting of Sans from Undertale, a huge animal skull floats behind him"
            description = "Sans from Undertale.">
            <img class="landscape" src="images/landscape papyrus undyne.jpg" 
            alt="A dynamic colour painting of Papyrus and Undyne from Undertale, they are in the middle of a sparring match."
            description = "Papyrus and Undyne from Undertale sparring.">
            <img class="landscape" src="images/landscape snowy forest.jpg" 
            alt="An atmospheric colour landscape painting of a snowy forest. A large figure stands in the middle, looking back at the viewer ominously"
            description = "Environment practice.">
            <img class="landscape" src="images/landscape youre blue now.jpg" 
            alt="A colour painting of Papyrus and Frisk from Undertale in a snowy forest."
            description = "Frisk and Papyrus from Undertale meeting.">
            <img class="portrait" src="images/black and white forest.jpg" 
            alt="A black and white painting of a forest, there is a winding path between them with a small child walking along it"
            description = "An inktober piece.">
            <img class="portrait" src="images/portrait miya butterfly.jpg" 
            alt="A colour painting of a girl with goat ears and horns, she is holding a glowing blue butterfly"
            description = "My original character, Miya.">
            
        </div>
        <h2 id = "chroma-art">Chroma Corps Art</h2>
        <div class="images">
            <img class = "portrait" src="images/Day 1 - Fanart.png" 
            alt="A fanart painting of another contestant's character. She is contempary punk, leaning against an amp with her guitar. Several cute mice climb over her."
            description = "Day 1 - Fanart of Celia's character.">
            <img class = "portrait" src="images/Day 14 - underwater shrine.png" 
            alt="A painting of an underwater scene. A small shrine sits atop a rock outcropping. A mermaid sits on top of the shrine, reaching towards a ginat whale passing overhead."
            description = "Day 14 - Underwater Shrine.">
            <img class = "landscape" src="images/Day 7 - album cover.png" 
            alt="A painting of robot character holding a brightly coloured album cover."
            description = "Day 7 - Album Cover.">
            <img class = "landscape" src="images/Day 9 - jellyfish party.png" 
            alt="A paintinig of a childs birthday party at an aquarium. A girl stands against the glass, holding a balloon. Brightly coloured jellyfish float by in the tank."
            description = "Day 9 - Jellyfish Party.">
            <img class = "landscape" src="images/Day 2 - hermit crab.png" 
            alt="A painting of a red hermit crab in a brightly lit environment. For a shell he has chosen an old handpan."
            description = "Day 2 - Hermit Crab">
            <img class = "landscape" src="images/day 16 - zombie dragon toad.png" 
            alt="A brightly coloured painting of an animal hybrid mix of toad, dragon and zombie."
            description = "Day 16 - Zombie-Dragon-Toad.">
            <img class = "landscape" src="images/day 19 - insane guitar solo.png" 
            alt="A painting of a concert, a robot character with its back facing us, looking out over a huge crowd. She's playing a floating keyboard."
            description = "Day 19 - Insane Guitar Solo">
            <img class = "portrait" src="images/Day 25 - nightmare battle.png" 
            alt="A painting of a nightmare scenario where a small robot character is surrounded by two giant dragon-like dinosaurs, playing guitar and firebreathing."
            description = "Day 25 - Nightmare Battle">
            <img class = "landscape" src="images/day 30 - rock on.png" 
            alt="A polaroid-style painting of two characters. One is holding the 'camera' for a selfie. Behind him, a robot character is visible, playing keyboard."
            description = "Day 30 - Rock On">
            <img class = "landscape" src="images/melody-splashart.png" 
            alt="A painting featuring a robot character called MEL-004. She is standing in front of her instrument, a floating electronic keybaord."
            description = "Cadet Sheet for Mel-004">
            <img class = "portrait" src="images/Nox-Splashart-fixed.png" 
            alt="A painting featuring a demon-like character with fiery hair and tail called Nox. He is singing into a microphone."
            description = "Cadet Sheet for Nox">
        </div>
        
    </main>
    <div id="enlarged-image" class = "hidden">
    </div>
    <footer>
        <img src="images/landscape snowy forest.jpg" alt="">
        <p>Copyright Mewpet, 2026</p>
    </footer>
